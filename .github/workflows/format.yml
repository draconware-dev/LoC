name: Format

on:
  workflow_call:
  push:
    branches: ["main", "dev"]
    paths:
      - "**.cs"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "**.cs"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
